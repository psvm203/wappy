name: 문제 신고
description: Wappy를 사용하는 중 불편하거나 예상과 다르게 동작한 일을 알려 주세요.
title: "[문제] "
body:
  - type: markdown
    attributes:
      value: |
        신고 내용은 공개됩니다. 로그인 토큰·복구 코드·초대장·서버 주소나 개인정보가 담긴 화면은 첨부하지 마세요.
        앱의 **도움말·앱 정보 → 문제 확인 정보 복사**를 사용하면 주소와 로그인 정보 없이 실행 상태를 전달할 수 있습니다.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 있었나요?
      description: 기대한 동작과 실제 동작을 함께 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 확인하는 방법
      description: 누른 버튼이나 문제 직전의 동작, 반복 여부를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 문제 확인 정보
      description: 앱에서 복사한 정보를 붙여넣어 주세요. 앱을 열 수 없다면 운영체제와 아는 앱 버전만 적어 주세요.
      render: text
    validations:
      required: true
