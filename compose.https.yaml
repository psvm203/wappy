services:
  server:
    ports: !reset []
    environment:
      TRUST_PROXY: "1"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WAPPY_DOMAIN: ${WAPPY_DOMAIN:?Set WAPPY_DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
